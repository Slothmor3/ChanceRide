name: Android checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"
      - name: Build, lint and unit tests
        run: >-
          bash ./gradlew
          :app:assembleDebug
          :app:assembleDebugAndroidTest
          :app:lintDebug
          :conversation-core:lintDebug
          :speech:lintDebug
          :driving-restrictions:lintDebug
          :conversation-core:testDebugUnitTest
          :speech:testDebugUnitTest
          :driving-restrictions:testDebugUnitTest
          --stacktrace
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7
